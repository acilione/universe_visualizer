<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Celestial body rendering audit</title><style>html,body{margin:0;background:#080c11;width:512px;height:512px;overflow:hidden}canvas{display:block;width:512px;height:512px}</style></head><body><canvas></canvas><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { catalog } from '/src/data.js';
import { solarMoons } from '/src/moons.js';
import { createPlanetVisual, updatePlanetVisualLighting, disposePlanetTextures } from '/src/planet-visuals.js';
const objects=[...catalog.solar,...solarMoons];
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(512,512,false);renderer.setPixelRatio(1);renderer.setClearColor('#080c11');renderer.outputColorSpace=THREE.SRGBColorSpace;

 const object=objects.find(item=>item.id===id);if(!object)throw Error('Unknown body '+id);

 }

 const axis=body.getObjectByName('body-axis').quaternion;const extent=body.userData.visualRadius||1;camera.left=camera.bottom=-extent*1.22;camera.right=camera.top=extent*1.22;camera.position.set(0,hemisphere==="south"?-2.2:2.2,5).applyQuaternion(axis).multiplyScalar(extent);camera.up.set(0,1,0).applyQuaternion(axis);camera.lookAt(0,0,0);camera.updateProjectionMatrix();camera.updateMatrixWorld(true);
 lightDirection.set(-2,hemisphere==="south"?-3:3,5).applyQuaternion(axis).normalize();light.position.copy(lightDirection);updatePlanetVisualLighting(body,lightDirection);scene.updateMatrixWorld(true);renderer.render(scene,camera);
 const surface=body.getObjectByName('planet-surface'),positions=surface.geometry.attributes.position;
 const box=new THREE.Box3(),point=new THREE.Vector3();let maxRadius=0;
 for(let i=0;i<positions.count;i++){point.fromBufferAttribute(positions,i);maxRadius=Math.max(maxRadius,point.length());}

},dispose(){disposeBody();disposePlanetTextures();renderer.dispose();}};

</script></body></html>
