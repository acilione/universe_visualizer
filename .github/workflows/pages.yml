name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /universe_visualizer/
      - run: npx playwright install --with-deps chromium
      - name: Check the hosted build
        run: |
          npm run preview -- --port 5174 --base /universe_visualizer/ > /tmp/atlas-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:5174/universe_visualizer/ > /dev/null && break
            sleep 1
          done
          npm run test:browser
        env:
          TEST_URL: http://localhost:5174/universe_visualizer/
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
