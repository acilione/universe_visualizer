name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /universe_visualizer/
      - run: npx playwright install --with-deps chromium
      - name: Check the hosted build
        timeout-minutes: 10
        run: |
          mkdir -p test-results
          npm run preview -- --port 5174 --strictPort --base /universe_visualizer/ > test-results/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --max-time 2 "$TEST_URL" > /dev/null; then
            cat test-results/preview.log
            exit 1
          fi
          npm run test:browser
        env:
          TEST_URL: http://localhost:5174/universe_visualizer/
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
